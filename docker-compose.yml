# Managio v2 as production-like containers on one machine: PostgreSQL, the API and the web app.
#   cp .env.example .env    # then fill in the MANAGIO_* values
#   docker compose up --build
#   open http://localhost:3000
# Only the web app is published. The browser reaches the API through the web app's /api pass-through, as on
# Vercel (docs/ARCHITECTURE.md). Settings are described in docs/ENVIRONMENT.md.
name: managio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: managio
      POSTGRES_USER: managio
      POSTGRES_PASSWORD: ${MANAGIO_DB_PASSWORD:?Set MANAGIO_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U managio -d managio"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./managio_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/managio
      DB_USERNAME: managio
      DB_PASSWORD: ${MANAGIO_DB_PASSWORD:?Set MANAGIO_DB_PASSWORD in .env (see .env.example)}
      JWT_SECRET: ${MANAGIO_JWT_SECRET:?Set MANAGIO_JWT_SECRET in .env (see .env.example)}
      APP_URL: http://localhost:${MANAGIO_WEB_PORT:-3000}
      CORS_ALLOWED_ORIGINS: http://localhost:${MANAGIO_WEB_PORT:-3000}
      # Plain http on localhost; every real deployment keeps the default (true) behind HTTPS.
      SECURE_COOKIES: "false"
      RESEND_API_KEY: ${MANAGIO_RESEND_API_KEY:-}
      MAIL_FROM: ${MANAGIO_MAIL_FROM:-Managio <onboarding@resend.dev>}
      MAIL_LOG_CONTENT: ${MANAGIO_MAIL_LOG_CONTENT:-false}
      GOOGLE_CLIENT_ID: ${MANAGIO_GOOGLE_CLIENT_ID:-}
      PLATFORM_ADMIN_EMAILS: ${MANAGIO_PLATFORM_ADMIN_EMAILS:-}
      API_PROXY_SECRET: ${MANAGIO_API_PROXY_SECRET:-}

  web:
    build:
      context: ./managio_frontend
      args:
        API_ORIGIN: http://api:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${MANAGIO_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      API_PROXY_SECRET: ${MANAGIO_API_PROXY_SECRET:-}
      # Nothing in front of this stack overwrites X-Forwarded-For, so no visitor address is vouched for and all
      # visitors share the web container's rate limits. Behind a reverse proxy, name the header it sets.
      CLIENT_IP_HEADER: ${MANAGIO_CLIENT_IP_HEADER:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MANAGIO_WEB_PORT:-3000}:3000"

volumes:
  db-data:
