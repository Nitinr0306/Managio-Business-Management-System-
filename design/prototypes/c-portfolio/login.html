<!doctype html>
<html lang="en" class="bg-[#12151C]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Managio (Portfolio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../data.js"></script>
  <script src="shell.js"></script>
  <style>body{font-feature-settings:'tnum' 1}</style>
</head>
<body class="bg-canvas text-ink antialiased">
<div class="min-h-screen grid lg:grid-cols-[520px_1fr]">
  <main class="flex flex-col px-6 sm:px-14 py-10 border-r border-line">
    <div class="flex items-center gap-2.5"><span class="grid place-items-center w-8 h-8 rounded bg-aqua text-canvas font-semibold">M</span><span class="text-[16px] font-medium">Managio</span></div>
    <form class="my-auto w-full max-w-[360px] pt-10" onsubmit="return false">
      <h1 class="text-[24px] leading-8 font-medium">Sign in</h1>
      <div class="mt-6 flex gap-6 border-b border-line text-[13px]" role="tablist" aria-label="Account type">
        <button role="tab" aria-selected="true" class="h-9 border-b-2 border-aqua -mb-px text-ink">Owner</button>
        <button role="tab" aria-selected="false" class="h-9 text-muted hover:text-ink">Staff</button>
        <button role="tab" aria-selected="false" class="h-9 text-muted hover:text-ink">Member</button>
      </div>
      <label for="email" class="block mt-6 text-[13px] text-muted">Email</label>
      <input id="email" type="email" value="ananya@example.com" class="mt-1.5 w-full h-9 px-3 rounded bg-surface border border-line text-[14px] focus:outline-none focus:border-aqua focus:ring-1 focus:ring-aqua">
      <div class="mt-4 flex items-baseline justify-between">
        <label for="pw" class="text-[13px] text-muted">Password</label>
        <a href="#" class="text-[13px] text-aqua hover:underline">Forgot password?</a>
      </div>
      <input id="pw" type="password" class="mt-1.5 w-full h-9 px-3 rounded bg-surface border border-aqua ring-1 ring-aqua text-[14px] focus:outline-none">
      <button class="mt-6 w-full h-9 rounded bg-aqua text-canvas text-[14px] font-medium hover:bg-aqua-dark">Sign in</button>
      <button class="mt-3 w-full h-9 rounded border border-line text-[14px] hover:bg-surface inline-flex items-center justify-center gap-2">
        <svg width="15" height="15" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.3 5.7c4.3-4 7-9.9 7-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.4 0 20.1 0 24s1 7.6 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>
        Continue with Google</button>
      <p class="mt-6 text-[13px] text-muted">New here? <a href="#" class="text-aqua hover:underline">Create a business account</a></p>
    </form>
  </main>
  <aside class="hidden lg:flex flex-col justify-center px-14 py-12 overflow-hidden" aria-hidden="true">
    <p class="text-[28px] leading-9 font-medium max-w-[560px]">Every branch, one honest view.</p>
    <p class="mt-2 text-[14px] text-muted max-w-[520px]">Compare collections, renewals and lapses across every business you run, then open the one that needs you.</p>
    <div class="mt-8 -mr-28 bg-surface border border-line rounded">
      <table class="w-full text-[13px]">
        <thead class="text-faint text-left"><tr class="h-9 border-b border-line"><th class="pl-4 font-normal">Business</th><th class="font-normal text-right">Active members</th><th class="font-normal text-right">Collected (Oct)</th><th class="font-normal pl-8">Renewal rate</th></tr></thead>
        <tbody id="mini" class="divide-y divide-line"></tbody>
      </table>
    </div>
  </aside>
</div>
<script>
  document.getElementById('mini').innerHTML = MANAGIO.branches.map(b => `
    <tr class="h-11"><td class="pl-4">${b.name}</td><td class="text-right">${b.members}</td><td class="text-right">${MANAGIO.inr(b.collected)}</td>
    <td class="pl-8"><span class="inline-flex items-center gap-2"><span class="w-8 text-right">${b.renewal}%</span><span class="w-28 h-1.5 rounded-full bg-line overflow-hidden"><span class="block h-full ${b.renewal < 80 ? 'bg-risk' : 'bg-aqua'}" style="width:${b.renewal}%"></span></span></span></td></tr>`).join('');
</script>
</body>
</html>
