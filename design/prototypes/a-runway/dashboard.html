<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview — Managio (Runway)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="../data.js"></script>
  <script src="shell.js"></script>
  <style>body{font-feature-settings:'tnum' 1}</style>
</head>
<body class="bg-canvas text-ink antialiased">
<div class="flex min-h-screen">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0 px-5 sm:px-8 py-7 max-w-[1240px]">
    <header class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-[22px] leading-7 font-semibold">Overview</h1>
        <p id="today" class="text-[13px] text-muted mt-0.5"></p>
      </div>
      <div class="flex gap-2">
        <button class="h-9 px-3.5 rounded-md border border-line bg-surface text-[13.5px] font-medium hover:bg-canvas focus-visible:outline focus-visible:outline-2 focus-visible:outline-cobalt inline-flex items-center gap-1.5"><i data-lucide="user-plus" class="w-4 h-4"></i>Add member</button>
        <button class="h-9 px-3.5 rounded-md bg-cobalt text-white text-[13.5px] font-semibold hover:bg-cobalt-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cobalt inline-flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i>Record payment</button>
      </div>
    </header>

    <!-- One KPI strip, not a card grid -->
    <section aria-label="Key figures" id="kpis" class="grid grid-cols-2 md:grid-cols-5 bg-surface border border-line rounded-lg divide-line [&>*]:border-line"></section>

    <!-- Signature: renewal runway -->
    <section class="mt-5 bg-surface border border-line rounded-lg p-5" aria-labelledby="runway-title">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <div>
          <h2 id="runway-title" class="text-[15px] font-semibold">Renewal runway</h2>
          <p class="text-[13px] text-muted">Memberships ending each day, next 30 days</p>
        </div>
        <p class="text-[13px] text-muted"><span class="font-semibold text-ink">23</span> end this week, <span class="font-semibold text-ink">61</span> in the next 30 days</p>
      </div>
      <div class="relative mt-10">
        <div id="runway" class="flex items-end gap-[5px] h-[148px] border-b border-line" role="img" aria-label="Bar chart of memberships ending per day over the next 30 days"></div>
        <div id="runway-axis" class="flex gap-[5px] mt-2 text-[11px] text-faint"></div>
      </div>
      <div class="mt-4 flex items-center gap-5 text-[12px] text-muted">
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-due"></span>This week</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-[#C9CFD9]"></span>Later</span>
      </div>
    </section>

    <div class="mt-5 grid xl:grid-cols-[1.45fr_1fr] gap-5">
      <section class="bg-surface border border-line rounded-lg" aria-labelledby="action-title">
        <div class="flex items-center justify-between px-5 h-12 border-b border-line">
          <h2 id="action-title" class="text-[15px] font-semibold">Needs action</h2>
          <a href="members.html" class="text-[13px] font-medium text-cobalt hover:underline">Open in Members</a>
        </div>
        <table class="w-full text-[13px]">
          <thead class="text-left text-faint">
            <tr class="h-9"><th class="pl-5 font-medium">Member</th><th class="font-medium">Plan</th><th class="font-medium">Ends</th><th class="font-medium">Status</th><th class="pr-5"><span class="sr-only">Action</span></th></tr>
          </thead>
          <tbody id="action" class="divide-y divide-line border-t border-line"></tbody>
        </table>
      </section>

      <section class="bg-surface border border-line rounded-lg" aria-labelledby="coll-title">
        <div class="flex items-center justify-between px-5 h-12 border-b border-line">
          <h2 id="coll-title" class="text-[15px] font-semibold">Today's collections</h2>
          <span id="coll-total" class="text-[15px] font-semibold"></span>
        </div>
        <ul id="collections" class="divide-y divide-line text-[13px]"></ul>
        <div class="px-5 py-4 border-t border-line">
          <h3 class="text-[13px] font-semibold">Payment mix this month</h3>
          <div id="mix-bar" class="mt-2.5 flex h-2 rounded-full overflow-hidden gap-px bg-line"></div>
          <ul id="mix-legend" class="mt-3 grid grid-cols-2 gap-y-1.5 text-[12px] text-muted"></ul>
        </div>
      </section>
    </div>
  </main>
</div>
<script>
  const { business: b, today, runway, members, plans, inr } = MANAGIO;
  document.getElementById('sidebar').outerHTML = A.sidebar('Overview');
  document.getElementById('today').textContent = today.dateLong;

  const delta = Math.round((b.collectedMonth - b.collectedPrevMonth) / b.collectedPrevMonth * 100);
  const kpis = [
    ['Active members', b.activeMembers, `+${b.newThisMonth} this month`, 'text-ok'],
    ['Collected in October', inr(b.collectedMonth), `+${delta}% vs September`, 'text-ok'],
    ['Collected today', inr(today.total), `${today.payments.length} payments`, 'text-muted'],
    ['Ending in 7 days', b.endingIn7, 'Renew before they lapse', 'text-due'],
    ['Lapsed in last 30 days', b.lapsed30, 'Worth a call', 'text-bad'],
  ];
  document.getElementById('kpis').innerHTML = kpis.map(([label, value, note, tone], i) => `
    <div class="px-5 py-4 ${i ? 'md:border-l' : ''} ${i > 1 ? 'border-t md:border-t-0' : ''} ${i % 2 ? 'border-l' : ''}">
      <div class="text-[12.5px] text-muted">${label}</div>
      <div class="mt-1 text-[26px] leading-8 font-semibold tracking-tight">${value}</div>
      <div class="mt-0.5 text-[12px] ${tone}">${note}</div>
    </div>`).join('');

  const max = Math.max(...runway.map(d => d.count));
  document.getElementById('runway').innerHTML = runway.map((d, i) => `
    <div class="group relative flex-1 h-full flex items-end">
      ${i === 0 ? '<span class="absolute -top-5 left-0 text-[11px] font-semibold text-ink">Today</span><span class="absolute top-0 bottom-0 left-0 w-px bg-ink/40"></span>' : ''}
      <div class="w-full rounded-t-[3px] ${d.inWeek ? 'bg-due' : 'bg-[#C9CFD9] group-hover:bg-[#AEB6C3]'}" style="height:${Math.max(5, d.count / (max * 1.3) * 100)}%"></div>
      <div class="pointer-events-none absolute left-1/2 -translate-x-1/2 -top-1" style="bottom:calc(${Math.max(5, d.count / (max * 1.3) * 100)}% + 8px);top:auto"><div class=" whitespace-nowrap rounded-md bg-ink text-white text-[12px] px-2 py-1 ${d.label === '24 Oct' ? 'hidden sm:block' : 'hidden group-hover:block'}">${d.label}: ${d.count} ${d.count === 1 ? 'membership ends' : 'memberships end'}</div></div>
    </div>`).join('');
  document.getElementById('runway-axis').innerHTML = runway.map((d, i) =>
    `<span class="flex-1 min-w-0 whitespace-nowrap overflow-visible ${i % 7 ? 'invisible' : ''}">${d.label}</span>`).join('');

  const action = members.filter(m => m.status === 'due' || m.status === 'lapsed');
  document.getElementById('action').innerHTML = action.map(m => `
    <tr class="h-11 hover:bg-canvas/60">
      <td class="pl-5 font-medium">${m.name}</td>
      <td class="text-muted">${plans[m.plan].name}</td>
      <td class="tabular-nums text-muted">${m.ends.replace(' 2026', '')}</td>
      <td>${A.pill(m)}</td>
      <td class="pr-5 text-right"><button class="text-[13px] font-semibold text-cobalt hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-cobalt rounded">Renew</button></td>
    </tr>`).join('');

  document.getElementById('coll-total').textContent = inr(today.total);
  document.getElementById('collections').innerHTML = today.payments.map(p => `
    <li class="flex items-center gap-4 px-5 h-11">
      <span class="w-11 tabular-nums text-faint">${p.time}</span>
      <span class="flex-1 font-medium">${p.member}</span>
      <span class="text-muted w-12">${p.method}</span>
      <span class="w-20 text-right tabular-nums font-medium">${inr(p.amount)}</span>
    </li>`).join('');

  const mixTone = ['bg-cobalt', 'bg-[#6D89DB]', 'bg-[#A9BAEA]', 'bg-[#D5DDF5]'];
  document.getElementById('mix-bar').innerHTML = b.paymentMix.map((m, i) => `<span class="${mixTone[i]}" style="width:${m.pct}%"></span>`).join('');
  document.getElementById('mix-legend').innerHTML = b.paymentMix.map((m, i) => `<li class="flex items-center gap-2"><span class="w-2 h-2 rounded-sm ${mixTone[i]}"></span>${m.method}<span class="tabular-nums text-ink font-medium">${m.pct}%</span></li>`).join('');
  lucide.createIcons();
</script>
</body>
</html>
