<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — Managio (Front Desk)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="../data.js"></script>
  <script src="shell.js"></script>
  <style>
    body{font-feature-settings:'tnum' 1}
    .slip{background:#fff;border:1px solid #DDE3DF;border-radius:12px;position:relative}
    .slip::before{content:'';position:absolute;left:12px;right:12px;top:-1px;border-top:2px dashed #DDE3DF}
  </style>
</head>
<body class="bg-canvas text-ink antialiased">
<div id="topbar"></div>
<main class="px-4 sm:px-6 py-7 max-w-[1320px]">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="font-display text-[32px] leading-[38px] font-bold">Good morning, Divya</h1>
      <p class="text-[15px] text-muted mt-1">Tuesday, 20 October</p>
    </div>
    <p class="text-[15px] text-muted"><span class="font-semibold text-ink">6 things</span> need you today</p>
  </div>

  <div class="mt-6 grid lg:grid-cols-[1fr_380px] gap-6 items-start">
    <section aria-label="Today's work" class="space-y-5" id="queues"></section>

    <aside class="space-y-5">
      <section class="bg-surface border border-line rounded-xl p-5" aria-labelledby="ct">
        <h2 id="ct" class="text-[15px] font-semibold text-muted">Collected today</h2>
        <p id="total" class="font-display text-[44px] leading-[48px] font-bold mt-1"></p>
        <div id="split-bar" class="mt-4 flex h-3 rounded-full overflow-hidden gap-[3px]"></div>
        <ul id="split" class="mt-3 grid grid-cols-3 text-[14px]"></ul>
      </section>
      <section aria-labelledby="rr">
        <div class="flex items-baseline justify-between mb-3">
          <h2 id="rr" class="text-[17px] font-semibold">Recent receipts</h2>
          <a href="#" class="text-[14px] font-semibold text-pine hover:underline">All payments</a>
        </div>
        <ul id="receipts" class="space-y-3"></ul>
      </section>
    </aside>
  </div>
</main>
<script>
  const { members, plans, today, inr } = MANAGIO;
  document.getElementById('topbar').outerHTML = B.topbar('Today');

  const queues = [
    { title: 'Renew in the next 7 days', tone: 'bg-[#FDF0D2] text-due', rows: members.filter(m => m.status === 'due'),
      actions: () => `<button class="h-11 px-4 rounded-xl border-2 border-pine text-pine font-semibold text-[15px] hover:bg-pine-100">Renew plan</button>` },
    { title: 'Expired recently, call to renew', tone: 'bg-[#FBE3E0] text-bad', rows: members.filter(m => m.status === 'lapsed'), sub: m => m.phone,
      actions: () => `<button class="h-11 px-3.5 rounded-xl border border-line font-semibold text-[15px] hover:bg-canvas inline-flex items-center gap-1.5"><i data-lucide="phone" class="w-4 h-4"></i>Call</button><button class="h-11 px-4 rounded-xl bg-pine text-white font-semibold text-[15px] hover:bg-pine-700">Renew plan</button>` },
    { title: 'New members without a plan', tone: 'bg-[#E9EDEB] text-muted', rows: members.filter(m => m.status === 'none'), sub: () => 'Joined 18 Oct',
      actions: () => `<button class="h-11 px-4 rounded-xl bg-sun text-pine font-semibold text-[15px] hover:bg-sun-dark">Assign plan</button>` },
  ];
  document.getElementById('queues').innerHTML = queues.map(q => `
    <div class="bg-surface border border-line rounded-xl">
      <h2 class="flex items-center gap-2.5 px-5 h-14 border-b border-line text-[17px] font-semibold">${q.title}
        <span class="grid place-items-center min-w-7 h-7 px-2 rounded-full text-[14px] ${q.tone}">${q.rows.length}</span></h2>
      <ul class="divide-y divide-line">${q.rows.map(m => `
        <li class="flex flex-wrap items-center gap-4 px-5 py-3 min-h-[72px]">
          ${B.avatar(m.name, m.status === 'lapsed' ? 'bg-[#FBE3E0] text-bad' : undefined)}
          <div class="flex-1 min-w-[160px]">
            <div class="text-[16px] font-semibold">${m.name}</div>
            <div class="text-[14px] text-muted">${q.sub ? q.sub(m) : plans[m.plan].name}</div>
          </div>
          ${m.status !== 'none' ? B.pill(m) : ''}
          <div class="flex gap-2">${q.actions(m)}</div>
        </li>`).join('')}
      </ul>
    </div>`).join('');

  document.getElementById('total').textContent = inr(today.total);
  const tones = ['bg-pine', 'bg-[#5E8C86]', 'bg-sun'];
  document.getElementById('split-bar').innerHTML = today.byMethod.map((m, i) => `<span class="${tones[i]}" style="width:${m.amount / today.total * 100}%"></span>`).join('');
  document.getElementById('split').innerHTML = today.byMethod.map((m, i) => `
    <li><span class="flex items-center gap-1.5 text-muted"><span class="w-2.5 h-2.5 rounded-sm ${tones[i]}"></span>${m.method}</span><span class="font-semibold tabular-nums">${inr(m.amount)}</span></li>`).join('');

  document.getElementById('receipts').innerHTML = today.payments.slice(0, 3).map(p => `
    <li class="slip px-4 pt-4 pb-3">
      <div class="flex items-start justify-between">
        <div>
          <div class="text-[16px] font-semibold">${p.member}</div>
          <div class="text-[13px] text-muted tabular-nums">${p.receipt}</div>
        </div>
        <div class="text-right">
          <div class="font-display text-[20px] font-bold tabular-nums">${inr(p.amount)}</div>
          <div class="text-[13px] text-muted">${p.method}, ${p.time}</div>
        </div>
      </div>
    </li>`).join('');
  lucide.createIcons();
</script>
</body>
</html>
