<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Managio (Front Desk)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="../data.js"></script>
  <script src="shell.js"></script>
</head>
<body class="bg-canvas text-ink antialiased min-h-screen">
<div class="bg-pine h-[42vh] min-h-[300px] px-6 sm:px-10 pt-8">
  <span class="font-display text-[22px] font-bold text-white tracking-tight">Managio</span>
</div>
<main class="px-4 -mt-[26vh] pb-16">
  <form class="mx-auto w-full max-w-[600px] bg-surface rounded-2xl border border-line p-6 sm:p-9" onsubmit="return false">
    <h1 class="font-display text-[28px] leading-8 font-bold">Who's signing in?</h1>
    <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3" role="radiogroup" aria-label="Account type">
      <button role="radio" aria-checked="false" class="text-left rounded-xl border border-line p-4 hover:border-pine/50">
        <i data-lucide="store" class="w-6 h-6 text-pine"></i>
        <div class="mt-3 font-semibold text-[16px]">I run a business</div><div class="text-[14px] text-muted">Owner</div>
      </button>
      <button role="radio" aria-checked="true" class="relative text-left rounded-xl border-2 border-pine bg-pine-100/50 p-4">
        <i data-lucide="badge-check" class="w-5 h-5 text-pine absolute right-3 top-3"></i>
        <i data-lucide="id-card" class="w-6 h-6 text-pine"></i>
        <div class="mt-3 font-semibold text-[16px]">I work here</div><div class="text-[14px] text-muted">Staff</div>
      </button>
      <button role="radio" aria-checked="false" class="text-left rounded-xl border border-line p-4 hover:border-pine/50">
        <i data-lucide="user-round" class="w-6 h-6 text-pine"></i>
        <div class="mt-3 font-semibold text-[16px]">I'm a member</div><div class="text-[14px] text-muted">Member</div>
      </button>
    </div>

    <label for="biz" class="block mt-7 text-[15px] font-semibold">Business ID</label>
    <input id="biz" value="4821IRWD" class="mt-2 w-full h-12 px-4 rounded-xl border-2 border-pine ring-4 ring-sun/50 text-[16px] tabular-nums tracking-wide focus:outline-none">
    <p class="mt-1.5 text-[14px] text-muted">It's on your invitation email. Ask your manager if you don't have it.</p>

    <label for="email" class="block mt-5 text-[15px] font-semibold">Email</label>
    <input id="email" type="email" class="mt-2 w-full h-12 px-4 rounded-xl border border-line text-[16px] focus:outline-none focus:ring-4 focus:ring-sun/50 focus:border-pine" placeholder="you@example.com">

    <div class="mt-5 flex items-baseline justify-between">
      <label for="pw" class="text-[15px] font-semibold">Password</label>
      <a href="#" class="text-[14px] font-semibold text-pine hover:underline">Forgot password?</a>
    </div>
    <input id="pw" type="password" class="mt-2 w-full h-12 px-4 rounded-xl border border-line text-[16px] focus:outline-none focus:ring-4 focus:ring-sun/50 focus:border-pine">

    <button class="mt-7 w-full h-[52px] rounded-xl bg-sun text-pine font-bold text-[17px] hover:bg-sun-dark">Sign in</button>
    <p class="mt-6 pt-5 border-t border-line text-center text-[15px] text-muted">Running a business? <a href="#" class="font-semibold text-pine hover:underline">Create an account</a></p>
  </form>
</main>
<script>lucide.createIcons()</script>
</body>
</html>
