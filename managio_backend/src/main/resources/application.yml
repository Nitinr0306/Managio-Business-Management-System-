# Configuration is read from environment variables. For local development, the
# untracked managio_backend/.env file is imported as properties (KEY=value lines).
spring:
  application:
    name: managio-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/managio}
    username: ${DB_USERNAME:managio_user}
    password: ${DB_PASSWORD:}
    hikari:
      # Neon and Render free tiers allow few connections; keep the pool small and recycle
      # connections before Neon's idle timeout closes them.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      max-lifetime: 300000
      idle-timeout: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # Jackson 3 rejects omitted primitive fields by default; an omitted boolean means false in this API.
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8081}
  # X-Forwarded-* headers are never trusted; ClientAddressFilter decides the client address.
  forward-headers-strategy: none
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  # Off unless asked for: production doesn't publish its API description. Local development and the
  # frontend's type generation turn it on (API_DOCS_ENABLED=true in managio_backend/.env).
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}

managio:
  app-url: ${APP_URL:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    secure-cookies: ${SECURE_COOKIES:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit-multiplier: ${RATE_LIMIT_MULTIPLIER:1}
    proxy-secret: ${API_PROXY_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:Managio <onboarding@resend.dev>}
    log-content: ${MAIL_LOG_CONTENT:false}
  admin:
    # Comma-separated emails of platform administrators (D-028). Their accounts must have a verified email.
    emails: ${PLATFORM_ADMIN_EMAILS:}

